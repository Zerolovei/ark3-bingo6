<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>第6回ARK3ビンゴ！Ⅵ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  text-align: center;
  color: #333;

  background-image: url("bac.png");
  background-size: 100% auto;
  background-position: center top;
  background-repeat: no-repeat;
  background-color: #dff4ff;

  min-height: 100vh;

  padding:
    max(6px, env(safe-area-inset-top))
    2px
    max(20px, env(safe-area-inset-bottom));
}

h1 {
  margin: 5px 0 4px;
  font-size: clamp(18px, 5vw, 29px);
  font-weight: 900;
  color: white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.9),
    0 0 10px rgba(0,0,0,.6);
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 4px auto;
}

button {
  border: none;
  border-radius: 999px;
  padding: 9px 13px;

  font-size: 11px;
  font-weight: bold;

  color: white;
  cursor: pointer;

  box-shadow:
    0 4px 10px rgba(0,0,0,.28);

  transition:
    transform .12s ease,
    opacity .2s ease,
    filter .2s ease;
}

button:active {
  transform: scale(.94);
}

#newCard {
  background:
    linear-gradient(
      135deg,
      #ff65a7,
      #9a6aff
    );
}

#startCard {
  background:
    linear-gradient(
      135deg,
      #42c978,
      #13975c
    );
}

#newCard.disabled,
#startCard.started {
  opacity: .45;
  filter: grayscale(.55);
  cursor: not-allowed;
}

#negiButton {
  background:
    linear-gradient(
      135deg,
      #54d774,
      #17964c
    );
}

#negiButton.active {
  background:
    linear-gradient(
      135deg,
      #00e4bc,
      #00a3d7
    );

  box-shadow:
    0 0 10px #00f2d2,
    0 0 20px rgba(0,220,255,.8);
}

#soundButton {
  background:
    linear-gradient(
      135deg,
      #42a5ff,
      #536dfe
    );
}

#luckyCounter {
  display: inline-block;

  margin: 3px auto;
  padding: 5px 12px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.90);

  color: #7a4b00;

  font-size: 12px;
  font-weight: 900;

  box-shadow:
    0 3px 8px rgba(0,0,0,.22);
}

.search-area {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 5px;
  margin: 3px auto 0;

  color: white;

  font-size: 12px;
  font-weight: bold;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9);
}

#panelSearch {
  max-width: 195px;
  padding: 6px 8px;

  border:
    2px solid rgba(255,255,255,.85);

  border-radius: 10px;

  background:
    rgba(255,255,255,.95);

  color: #222;

  font-size: 11px;
  font-weight: bold;
}

#bingo {
  min-height: 34px;

  display: flex;
  justify-content: center;
  align-items: center;

  margin: 0 auto;

  font-size:
    clamp(20px, 6vw, 34px);

  font-weight: 900;
  color: white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.95),
    0 0 12px rgba(255,0,100,.9);
}

#board {
  display: grid;

  grid-template-columns:
    repeat(9, minmax(0, 1fr));

  gap: 2px;

  width:
    min(99vw, 720px);

  margin: 0 auto;
  padding: 4px;

  border-radius: 14px;

  background:
    rgba(255,255,255,.25);

  box-shadow:
    0 5px 20px rgba(0,0,0,.38);

  backdrop-filter:
    blur(1.5px);
}

.cell {
  aspect-ratio: 1 / 1;
  min-width: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;
  padding: 1px;

  border-radius: 5px;

  background:
    rgba(255,255,255,.84);

  border:
    1px solid rgba(255,255,255,.95);

  font-size:
    clamp(6.4px, 1.75vw, 11px);

  font-weight: 700;
  line-height: 1.08;

  overflow-wrap: anywhere;

  user-select: none;
  cursor: pointer;

  box-shadow:
    inset 0 0 4px rgba(255,255,255,.8);

  transition:
    transform .12s ease,
    background .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}

.cell:active {
  transform: scale(.92);
}

.cell.checked {
  background:
    rgba(48,190,95,.94);

  color: white;

  text-shadow:
    0 1px 3px rgba(0,0,0,.65);
}

.cell.last {
  background:
    rgba(255,214,38,.97);

  color: #222;

  text-shadow: none;

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.55),
    0 0 9px rgba(255,220,0,.8);
}

.cell.reach {
  background:
    rgba(157,92,255,.96);

  color: white;

  text-shadow:
    0 1px 3px rgba(0,0,0,.65);

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.4),
    0 0 9px rgba(157,92,255,.8);
}

.cell.bingo-cell {
  background:
    rgba(255,61,155,.97);

  color: white;

  text-shadow:
    0 1px 3px rgba(0,0,0,.7);

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.45),
    0 0 10px rgba(255,40,145,.85);
}

.cell.free {
  background:
    linear-gradient(
      135deg,
      rgba(67,198,255,.97),
      rgba(157,105,255,.97)
    );

  color: white;
  font-weight: 900;
}

.cell.free.bingo-cell {
  background:
    rgba(255,61,155,.97);
}

.cell.search-hit {
  position: relative;

  outline:
    3px solid #27c8ff;

  outline-offset: -3px;

  box-shadow:
    inset 0 0 0 2px white,
    0 0 10px #21c8ff,
    0 0 20px #21c8ff;

  z-index: 3;
}

.cell.negi-target {
  position: relative;

  outline:
    3px solid #00ffd5;

  outline-offset: -3px;

  z-index: 5;

  animation:
    negiGlow
    .65s
    ease-in-out
    infinite
    alternate;
}

@keyframes negiGlow {
  from {
    box-shadow:
      inset 0 0 0 2px white,
      0 0 8px #00ffd5;
  }

  to {
    box-shadow:
      inset 0 0 0 2px white,
      0 0 15px #00ffd5,
      0 0 28px #00bfff;
  }
}

/* 当たり演出 */

#luckyOverlay {
  position: fixed;
  inset: 0;

  display: none;

  justify-content: center;
  align-items: center;
  flex-direction: column;

  z-index: 9999;

  background:
    rgba(0,0,0,.28);

  pointer-events: none;
}

#luckyOverlay.show {
  display: flex;

  animation:
    overlayFade
    1.8s
    ease
    forwards;
}

#luckyImage {
  width:
    min(78vw, 380px);

  max-height:
    60vh;

  object-fit: contain;

  filter:
    drop-shadow(
      0 8px 14px rgba(0,0,0,.4)
    );

  animation:
    luckyPop
    .4s
    cubic-bezier(.2,1.6,.4,1);
}

#luckyText {
  margin-top: -5px;

  font-size:
    clamp(32px, 10vw, 58px);

  font-weight: 1000;

  color: #fff;

  -webkit-text-stroke:
    2px #ff8c00;

  text-shadow:
    0 4px 0 #ff5e00,
    0 0 12px #fff,
    0 0 25px #ffd700;
}

#luckySubText {
  margin-top: 3px;

  font-size: 18px;
  font-weight: 900;

  color: white;

  text-shadow:
    0 2px 5px black;
}

@keyframes luckyPop {
  0% {
    transform:
      scale(.2)
      rotate(-10deg);

    opacity: 0;
  }

  75% {
    transform:
      scale(1.08)
      rotate(2deg);
  }

  100% {
    transform:
      scale(1)
      rotate(0);
  }
}

@keyframes overlayFade {
  0% {
    opacity: 0;
  }

  12% {
    opacity: 1;
  }

  78% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }
}

/* BINGO演出 */

#bingoOverlay {
  position: fixed;
  inset: 0;

  display: none;

  justify-content: center;
  align-items: center;

  z-index: 10000;

  background:
    rgba(255,255,255,0);

  pointer-events: none;
}

#bingoOverlay.show {
  display: flex;

  animation:
    bingoScreenFlash
    2.1s
    ease
    forwards;
}

#bingoImage {
  width:
    min(88vw, 430px);

  max-height:
    78vh;

  object-fit: contain;

  border-radius: 20px;

  box-shadow:
    0 0 20px rgba(255,255,255,.95),
    0 0 45px rgba(255,220,0,.9);

  animation:
    bingoPop
    .45s
    cubic-bezier(.2,1.6,.4,1);
}

@keyframes bingoPop {
  0% {
    transform:
      scale(.15)
      rotate(-8deg);

    opacity: 0;
  }

  65% {
    transform:
      scale(1.08)
      rotate(2deg);

    opacity: 1;
  }

  100% {
    transform:
      scale(1)
      rotate(0);

    opacity: 1;
  }
}

@keyframes bingoScreenFlash {
  0% {
    opacity: 0;
    background: rgba(255,255,255,.95);
  }

  10% {
    opacity: 1;
    background: rgba(255,255,255,.75);
  }

  25% {
    background: rgba(255,220,60,.22);
  }

  80% {
    opacity: 1;
    background: rgba(0,0,0,.18);
  }

  100% {
    opacity: 0;
    background: rgba(0,0,0,0);
  }
}

/* リセット */

.reset-area {
  width: min(99vw, 720px);
  margin: 18px auto 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
}

#negiCancelButton {
  padding: 9px 14px;
  background: rgba(166,75,25,.92);
  color: white;
  font-size: 12px;
  font-weight: bold;
  border: 1px solid #ffd59e;
  border-radius: 8px;
  cursor: pointer;
}
#resetButton {
  padding:
    9px 18px;

  background:
    rgba(50,50,50,.82);

  color: white;

  font-size: 11px;

  border:
    1px solid rgba(255,255,255,.55);

  opacity: .8;
}

@media (max-width: 600px) {

  body {
    background-size: 100% auto;
    background-position: center top;
  }

  h1 {
    font-size: 18px;
  }

  button {
    padding: 8px 9px;
    font-size: 10px;
  }

  #board {
    width: 99vw;
    gap: 2px;
    padding: 3px;
  }

  .cell {
    font-size: 6.6px;
    border-radius: 4px;
  }
}

/* ネギ配達：検索欄の右に独立した丸ボタン */
#negiDeliveryButton{
  width:84px;height:84px;flex:0 0 84px;border-radius:50%;
  border:3px solid #d7ff9b;color:#fff;font-weight:900;font-size:15px;
  line-height:1.2;text-shadow:0 2px 3px #246a21;
  background:linear-gradient(145deg,#84dc28,#169a5a);
  box-shadow:0 4px 12px #0007, inset 0 2px 6px #ffffff75;
  cursor:pointer;white-space:nowrap;
}
#negiDeliveryButton:active{transform:scale(.94)}
/* ネギ配達で開いたマスはオレンジ色で固定（再クリック不可） */
.cell.negiDelivered,.cell.negiDelivered.checked,.cell.negiDelivered.last,
.cell.negiDelivered.reach,.cell.negiDelivered.bingo-cell,.cell.negiDelivered.search-hit{
  background:#ff941f!important;color:#4b2300!important;
  border:2px solid #ffe8a1!important;
  box-shadow:0 0 10px 3px #ffb347!important;
}
.cell.negiDeliveryPulse{animation:negiDeliveryPulse 1s ease-in-out 3!important}
@keyframes negiDeliveryPulse{50%{filter:brightness(1.8);transform:scale(1.1)}}
</style>

<style>
#surpriseOverlay{position:fixed;inset:0;z-index:99999;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column}
#surpriseOverlay.active{display:flex}
#surpriseOverlay img{position:absolute;width:100%;height:100%;object-fit:contain}
#surpriseChoices{position:absolute;bottom:12%;left:0;right:0;display:flex;gap:18px;justify-content:center;z-index:2}
#surpriseChoices button{font-size:22px;padding:16px 30px;background:#fff;color:#222;border:3px solid #bda1ff}
#surpriseFlash{position:fixed;inset:0;z-index:100000;pointer-events:none;display:none;background:#fff}
.cell.surpriseChanged{animation:surpriseGlow 1s ease-in-out 5!important;outline:4px solid #ffda27;z-index:2;position:relative}
/* イベント変化マスはチェック後も最優先で赤色固定 */
.cell.surprisePermanent,
.cell.surprisePermanent.checked,
.cell.surprisePermanent.last,
.cell.surprisePermanent.reach,
.cell.surprisePermanent.bingo-cell,
.cell.surprisePermanent.search-hit { background: #e52232 !important; color: #fff !important; border-color: #ffb2b2 !important; }
@keyframes surpriseGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(2);box-shadow:0 0 24px 9px #ffe000}}
</style>

<style>
#stationClearOverlay{position:fixed;inset:0;z-index:99998;background:#000;display:none;align-items:center;justify-content:center;z-index:99998}
#stationClearOverlay.active{display:flex}
#stationClearImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#stationClearChoices{position:absolute;bottom:11%;width:100%;display:flex;justify-content:center;gap:16px;z-index:1}
#stationClearChoices button{padding:16px 22px;border:2px solid #fff;border-radius:22px;font-weight:900;font-size:20px;background:#fff;color:#292034}
.cell.stationClearBlue,.cell.stationClearBlue.checked,.cell.stationClearBlue.last,.cell.stationClearBlue.bingo-cell,.cell.stationClearBlue.search-hit{background:#1887f7!important;color:#fff!important;border:2px solid #9beaff!important;box-shadow:0 0 13px #54baff!important}
.cell.stationClearAdded,.cell.stationClearAdded.checked,.cell.stationClearAdded.last,.cell.stationClearAdded.bingo-cell{border:3px solid #ef74ff!important;box-shadow:0 0 12px #d870ff!important}
</style>
</head>

<body>

<h1>第6回ARK3ビンゴ！Ⅵ</h1>

<div class="controls">

  <button
    id="newCard"
    onclick="requestNewBoard()">
    🎲 カード再生成
  </button>

  <button
    id="startCard"
    onclick="startCardGame()">
    🔒 このカードで開始！
  </button>

  <button
    id="negiButton"
    onclick="toggleNegiMode()">
    🥬 ネギサーチ
  </button>

  <button
    id="soundButton"
    onclick="toggleSound()">
    🔊 音ON
  </button>

</div>

<div id="luckyCounter">
  🎯 あたり：0回
</div>

<div class="search-area">

  🔍

  <select
    id="panelSearch"
    onchange="highlightSearch()">

    <option value="">
      パネル検索
    </option>

  </select>

  <button type="button" id="negiDeliveryButton" onclick="deliverNegiRandom()" title="未チェックのステーションをランダムで1つ開く">🥬<br>ネギ配達！</button>

</div>

<div id="bingo"></div>

<div id="board"></div>

  </button>

<!-- 当たり演出 -->

<div id="luckyOverlay">

    alt="">

  <div id="luckyText">
    あたりー！
  </div>

  <div id="luckySubText"></div>

</div>

<!-- BINGO演出 -->

<div id="bingoOverlay">

  <img
    id="bingoImage"
    src="BINGO.png"

</div>

<!-- 音源 -->

<audio
  id="reachSound"
  preload="auto"

</audio>

<audio
  id="bingoSound"
  preload="auto"
  src="sokuji.mp3">
</audio>

<script>

/* 第6回：突発質問・天誅・ご褒美の演出は後日追加予定 */

/* ==================================================
   候補
================================================== */

const areaItems = [
  "笹塚",
  "南台",
  "千駄ヶ谷",
  "松濤",
  "幡ヶ谷",
  "松原",
  "西新宿",
  "西原",
  "富ヶ谷",
  "和田",
  "堀之内",
  "方南町",
  "渋谷本町",
  "中野本町",
  "元代々木",
  "弥生町",
  "羽根木",
  "大原",
  "代々木",
  "北沢",
  "代田",
  "初台",
  "永福町",
  "和泉",
  "上原",
  "大山",
  "大宮",
  "西永福",
  "神山町"
];

const normalItems = [
  "タワマン",

  "アップル1",
  "アップル2",
  "アップル3",
  "アップル4",

  "バナナ1",
  "バナナ2",
  "バナナ3",
  "バナナ4",

  "キャロット1",
  "キャロット2",
  "キャロット3",
  "キャロット4",

  "荷物１つ",
  "荷物２つ",
  "荷物３つ",
  "荷物４つ",

  "階段２F",
  "階段３F",
  "階段４F",
  "階段５F",
  "階段∞",

  "長距離3.8",
  "近距離0.5",

  "戸建",
  "店舗",
  "持ち帰り",
  "配達なし",
  "雨配達",

  "オートロック２個以上"
];


/* スタッフ */

const staffItems = [
  "野田さん",
  "金子さん",
  "福島さん",
  "矢田部さん",
  "萩原さん",
  "大島さん"
];


/*
  ステーション

  ・最低4枚
  ・最高8枚
  ・重複OK
*/

const stationItems = [
  "五反田",
  "新橋",
  "麻布十番",
  "南青山",
  "三軒茶屋",
  "自由が丘",
  "北千束",
  "大森",
  "千歳船橋",
  "塩浜"
];


/*
  ステーションを含まない候補。

  ★重要
  ステーション総数を先に決めたあと、
  残りは必ずこのプールから選ぶ。

  これによりステーションが
  8枚を超えることは絶対にない。
*/

const nonStationPool = [
  ...areaItems,
  ...normalItems,
  ...staffItems
];


/* ==================================================
   保存キー

   既存参加者を維持するため
   絶対に変更しない
================================================== */

const BOARD_KEY =
  "ark3_bingo_sixth_board_v1";

const CHECK_KEY =
  "ark3_bingo_sixth_checks_v1";

const LAST_KEY =
  "ark3_bingo_sixth_last_v1";

const START_KEY =
  "ark3_bingo_sixth_started_v1";

const SOUND_KEY =
  "ark3_bingo_sixth_sound_v1";

const LUCKY_KEY =
  "ark3_bingo_sixth_lucky_count_v1";

const DRAWN_KEY =
  "ark3_bingo_sixth_drawn_cells_v1";


/* ==================================================
   状態
================================================== */

let negiMode = false;

let luckyTimer = null;

let bingoAnimationTimer = null;


/* ==================================================
   9×9 BINGOライン
================================================== */

const lines = [];


/* 横 */

for (let r = 0; r < 9; r++) {

  const line = [];

  for (let c = 0; c < 9; c++) {

    line.push(
      r * 9 + c
    );

  }

  lines.push(line);
}


/* 縦 */

for (let c = 0; c < 9; c++) {

  const line = [];

  for (let r = 0; r < 9; r++) {

    line.push(
      r * 9 + c
    );

  }

  lines.push(line);
}


/* 斜め */

lines.push([
  0,10,20,30,40,50,60,70,80
]);

lines.push([
  8,16,24,32,40,48,56,64,72
]);


/* ==================================================
   基本
================================================== */

function randomFrom(array) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

  return array;
}


/* ==================================================
   開始ロック
================================================== */

function isStarted() {

  return (
    localStorage.getItem(
      START_KEY
    ) === "started"
  );

}


function startCardGame() {

  if (isStarted()) {
    return;
  }


  const ok =
    confirm(

/* ==================================================
   新規カード生成

   ★今回の重要変更

   ① エリア30枚を先に保証
   ② ステーション総数を4～8枚で先に決定
   ③ 決めた枚数だけステーションを入れる
   ④ 残りはステーション無しの候補から抽選

   → ステーションは必ず4～8枚
   → 9枚以上には絶対ならない
   → 同一ステーション重複OK
================================================== */

function generateNewBoard() {

  const selected = [];


  /*
    ① エリア30枚保証
  */

  for (
    let i = 0;
    i < 30;
    i++
  ) {

    selected.push(
      randomFrom(
        areaItems
      )
    );

  }


  /*
    ② ステーション総数を決定

    Math.random() * 5
      ↓
    0～4

    +4
      ↓
    4・5・6・7・8

    のどれかになる。
  */

  const stationTotal =
    4 +
    Math.floor(
      Math.random() * 5
    );


  /*
    ③ 決めた枚数だけ
       ステーションを入れる

    毎回独立抽選なので
    同じステーションが
    複数枚あってOK。
  */

  for (
    let i = 0;
    i < stationTotal;
    i++
  ) {

    selected.push(
      randomFrom(
        stationItems
      )
    );

  }


  /*
    ④ 残りを80枚になるまで追加

    ★ここでは絶対に
      stationItemsを使わない。

    だからステーション総数は
    stationTotalから増えない。
  */

  while (
    selected.length < 80
  ) {

    selected.push(
      randomFrom(
        nonStationPool
      )
    );

  }


  /*
    スタッフ最低1枚保証
  */

  const hasStaff =
    selected.some(
      item =>
        staffItems.includes(
          item
        )
    );


  if (!hasStaff) {

    /*
      エリア保証30枚と
      ステーションを壊さないため、

      ステーションではなく、
      先頭30枚でもない場所を
      交換対象にする。
    */

    const replaceCandidates = [];


    for (
      let i = 30 + stationTotal;
      i < 80;
      i++
    ) {

      replaceCandidates.push(i);

    }


    if (
      replaceCandidates.length > 0
    ) {

      const replaceIndex =
        randomFrom(
          replaceCandidates
        );


      selected[replaceIndex] =
        randomFrom(
          staffItems
        );

    }

  }


  /*
    全体をシャッフル
  */

  shuffle(selected);


  /*
    中央にFREE
  */

  selected.splice(
    40,
    0,
    "FREE"
  );


  const checked =
    new Array(81)
      .fill(false);


  checked[40] = true;


  /*
    当たり抽選済み管理
  */

  const drawn =
    new Array(81)
      .fill(false);


  drawn[40] = true;


  /*
    保存
  */

  localStorage.setItem(
    BOARD_KEY,
    JSON.stringify(
      selected
    )
  );


  localStorage.setItem(
    CHECK_KEY,
    JSON.stringify(
      checked
    )
  );


  localStorage.setItem(
    DRAWN_KEY,
    JSON.stringify(
      drawn
    )
  );


  localStorage.setItem(
    LUCKY_KEY,
    "0"
  );


  localStorage.removeItem(
    LAST_KEY
  );


  localStorage.removeItem(
    START_KEY
  );


  negiMode = false;
  localStorage.removeItem(SURPRISE_KEY);
  localStorage.removeItem(SURPRISE_TARGET_KEY);
  localStorage.removeItem(SURPRISE_COUNT_KEY);
  localStorage.removeItem(SURPRISE_CHANGED_KEY);
  localStorage.removeItem(NEGI_DELIVERED_KEY);
  localStorage.removeItem(LUCKY_HIT_MAP_KEY);
  clearStationClearData();

  renderBoard(
    selected,
    checked,
    null
  );


  updateLuckyCounter();

  updateStartDisplay();

  updateNegiDisplay();
}

   盤面表示
================================================== */

function renderBoard(
  boardData,
  checkedData,
  lastIndex
) {

  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML = "";


  boardData.forEach(
    (item, index) => {


      const cell =
        document.createElement(
          "div"
        );


      cell.classList.add(
        "cell"
      );


      cell.dataset.index =
        index;


      cell.dataset.item =
        item;


      if (
        index === 40 && item === "FREE"
      ) {

        cell.textContent =
          "FREE";


        cell.classList.add(
          "free"
        );

      }


      else if (
        item ===
        "オートロック２個以上"
      ) {

        cell.innerHTML =
          "オートロック<br>２個以上";

      }


      else {

        cell.textContent =
          item;

      }


      if (
        index !== 40 || item !== "FREE"
      ) {

        cell.addEventListener(
          "click",
          function () {

            handleCellClick(
              index
            );

          }
        );

      }


      board.appendChild(
        cell
      );

    }
  );


  updateColors(
    checkedData,
    lastIndex
  );


  highlightSearch();

  updateNegiTargets();
  // 旧版の単一マス保存にも対応しつつ、複数の変化マスを赤く固定する。
  applyNegiDeliveredStyles();
  applyStationClearStyles();
  const savedChanged = localStorage.getItem(SURPRISE_CHANGED_KEY);
  if (savedChanged !== null) {
    let changedIndices;
    try {
      const parsed = JSON.parse(savedChanged);
      changedIndices = Array.isArray(parsed) ? parsed : [parsed];
    } catch (_) {
      changedIndices = [Number(savedChanged)];
    }
    changedIndices.forEach(index => {
      if (Number.isInteger(index) && index >= 0 && index < 81) {
        const specialCell = board.querySelector('.cell[data-index="' + index + '"]');
        if (specialCell) specialCell.classList.add("surprisePermanent");
      }
    });
  }
}


/* ==================================================
   マスクリック
================================================== */

function handleCellClick(index) {
  if(readStationIndices(STATION_CLEAR_BLUE_KEY).includes(index))return;

  // ネギ配達で自動オープンしたマスは、再タップしても閉じない。
  let negiDeliveredIndices = [];
  try { negiDeliveredIndices = JSON.parse(localStorage.getItem(NEGI_DELIVERED_KEY) || "[]"); } catch (_) {}
  if (Array.isArray(negiDeliveredIndices) && negiDeliveredIndices.includes(index)) return;

  const boardData =
    getBoard();

  const checked =
    getChecked();


  /*
    ネギ遠隔モード
  */

  if (negiMode) {

    const item =
      boardData[index];


    if (
      stationItems.includes(
        item
      ) &&
      !checked[index]
    ) {

      openCell(index);


      negiMode = false;


      updateNegiDisplay();

      updateNegiTargets();

    }


    return;
  }


  /*
    通常
  */

  if (
    checked[index]
  ) {

    checked[index] = false;
    rollbackLuckyDraw(index);
    syncSurpriseProgress();

    if (
      getLastIndex() ===
      index
    ) {

      localStorage.removeItem(
        LAST_KEY
      );

    }


    localStorage.setItem(
      CHECK_KEY,
      JSON.stringify(
        checked
      )
    );


    updateColors(
      checked,
      getLastIndex()
    );


    highlightSearch();

  }

  else {

    openCell(index);

  }
}

   マスを開く
================================================== */

function openCell(index, source = "manual") {

  const checked =
    getChecked();


  const beforeState =
    getLineState(
      checked
    );


  checked[index] = true;

  checked[40] = getBoard()[40] === "FREE" ? true : Boolean(checked[40]);


  localStorage.setItem(
    LAST_KEY,
    String(index)
  );


  localStorage.setItem(
    CHECK_KEY,
    JSON.stringify(
      checked
    )
  );


  /*
    初回だけ1/6抽選
  */

  runLuckyDrawOnce(
    index
  );


  updateColors(
    checked,
    index
  );


  const afterState =
    getLineState(
      checked
    );


  handleLineEvent(
    beforeState,
    afterState
  );


  highlightSearch();
  if (source !== "negiDelivery") surpriseProgress();
  scheduleStationClearCheck();
}

  return drawn;

/* ==================================================
   当たり抽選

   1マスにつき1回
   当たり確率 1/6
================================================== */

const LUCKY_HIT_MAP_KEY = "ark3_bingo_sixth_lucky_hit_map_v1";
function getLuckyHitMap(){
  try {
    const map=JSON.parse(localStorage.getItem(LUCKY_HIT_MAP_KEY)||"{}");
    return map && typeof map==="object" && !Array.isArray(map) ? map : {};
  } catch (_) {return {};}
}
function rollbackLuckyDraw(index){
  const drawn=getDrawnCells();
  if(!drawn[index])return;
  drawn[index]=false;
  localStorage.setItem(DRAWN_KEY,JSON.stringify(drawn));
  const hits=getLuckyHitMap();
  if(hits[index]===true){
    const count=Number(localStorage.getItem(LUCKY_KEY)||0);
    localStorage.setItem(LUCKY_KEY,String(Math.max(0,count-1)));
    updateLuckyCounter();
  }
  delete hits[index];
  localStorage.setItem(LUCKY_HIT_MAP_KEY,JSON.stringify(hits));
}
function runLuckyDrawOnce(index) {

  const drawn =
    getDrawnCells();


  if (
    drawn[index]
  ) {

    return;

  }


  drawn[index] = true;


  localStorage.setItem(
    DRAWN_KEY,
    JSON.stringify(
      drawn
    )
  );


  /*
    1/6
  */

  const hit =
    Math.random() < (1 / 6);
  const hits=getLuckyHitMap();
  hits[index]=hit;
  localStorage.setItem(LUCKY_HIT_MAP_KEY,JSON.stringify(hits));

  if (!hit) {
    return;
  }


  let count =
    Number(
      localStorage.getItem(
        LUCKY_KEY
      ) || "0"
    );


  count++;


  localStorage.setItem(
    LUCKY_KEY,
    String(count)
  );


  updateLuckyCounter();


  showLuckyAnimation(
    count
  );
}

/* ==================================================
   ライン状態
================================================== */

function getLineState(checked) {

  let bingoCount = 0;

  let reachCount = 0;


  lines.forEach(
    line => {


      const checkedCount =
        line.filter(
          index =>
            checked[index]
        ).length;


      if (
        checkedCount === 9
      ) {

        bingoCount++;

      }

      else if (
        checkedCount === 8
      ) {

        reachCount++;

      }

    }
  );


  return {
    bingoCount,
    reachCount
  };
}


/* ==================================================
   リーチ / BINGO
================================================== */

function handleLineEvent(
  before,
  after
) {

  /*
    BINGO優先
  */

  if (
    after.bingoCount >
    before.bingoCount
  ) {

    if (
      isSoundOn()
    ) {

      playSound(
        "bingoSound"
      );

    }


    showBingoAnimation();


    return;
  }


  /*
    リーチ
  */

  if (
    after.reachCount >
    before.reachCount
  ) {

    if (
      isSoundOn()
    ) {

      playSound(
        "reachSound"
      );

    }

  }
}


function playSound(id) {

  const audio =
    document.getElementById(
      id
    );


  if (!audio) {
    return;
  }


  try {

    audio.pause();

    audio.currentTime = 0;


    const promise =
      audio.play();


    if (promise) {

      promise.catch(
        function () {}
      );

    }

  }

  catch (e) {}
}

function getChecked() {

      JSON.parse(

          CHECK_KEY
        )
      );

  }

  catch (e) {

    checked = null;

  }


  if (
    !Array.isArray(
      checked
    ) ||
    checked.length !== 81
  ) {

    checked =
      new Array(81)
        .fill(false);

  }


  checked[40] = getBoard()[40] === "FREE" ? true : Boolean(checked[40]);


  return checked;
}


function getLastIndex() {

  const value =
    localStorage.getItem(
      LAST_KEY
    );


  if (
    value === null
  ) {

    return null;

  }


  const number =
    Number(value);


  if (
    Number.isInteger(
      number
    ) &&
    number >= 0 &&
    number < 81
  ) {

    return number;

  }


  return null;
}


/* ==================================================
   色更新
================================================== */

function updateColors(
  checked,
  lastIndex
) {

  const cells =
    [
      ...document.querySelectorAll(
        ".cell"
      )
    ];


  cells.forEach(
    (cell, index) => {


      cell.classList.remove(
        "checked",
        "last",
        "reach",
        "bingo-cell"
      );


      if (
        index === 40 && getBoard()[40] === "FREE"
      ) {

        cell.classList.add(
          "free",
          "checked"
        );

      }

      else if (
        checked[index]
      ) {

        cell.classList.add(
          "checked"
        );

      }

    }
  );


  /*
    完成ライン
  */

  const completedLines =
    lines.filter(
      line =>
        line.every(
          index =>
            checked[index]
        )
    );


  const bingoCells =
    new Set();


  completedLines.forEach(
    line => {

      line.forEach(
        index =>
          bingoCells.add(
            index
          )
      );

    }
  );


  /*
    リーチ
  */

  const reachCells =
    new Set();


  lines.forEach(
    line => {


      const missing =
        line.filter(
          index =>
            !checked[index]
        );


      if (
        missing.length === 1
      ) {

        reachCells.add(
          missing[0]
        );

      }

    }
  );


  /*
    最後に開いたマス
  */

  if (
    lastIndex !== null &&
    checked[lastIndex] &&
    !bingoCells.has(
      lastIndex
    )
  ) {

    cells[lastIndex]
      .classList
      .add(
        "last"
      );

  }


  /*
    リーチ
  */

  reachCells.forEach(
    index => {

      if (
        !checked[index] &&
        !bingoCells.has(
          index
        )
      ) {

        cells[index]
          .classList
          .add(
            "reach"
          );

      }

    }
  );


  /*
    BINGO
  */

  bingoCells.forEach(
    index => {


      cells[index]
        .classList
        .remove(
          "last",
          "reach"
        );


      cells[index]
        .classList
        .add(
          "bingo-cell"
        );

    }
  );


  updateBingoText(
    completedLines.length,
    checked
  );


  updateNegiTargets();
}

}

/* ==================================================
   既存カードの読み込み

   ★既存カードは盤面を作り直さない。

   維持するもの：
   ・盤面
   ・チェック
   ・開始ロック
   ・当たり回数
   ・抽選済み記録
   ・最後に開いたマス

   ★既存カードのステーション枚数は
     4～8枚に強制変更しない。
================================================== */

function loadBoard() {

  let boardData;
  let checkedData;


  try {

    boardData =
      JSON.parse(
        localStorage.getItem(
          BOARD_KEY
        )
      );


    checkedData =
      JSON.parse(
        localStorage.getItem(
          CHECK_KEY
        )
      );

  }

  catch (e) {

    boardData = null;
    checkedData = null;

  }


  /*
    既存カードあり
  */

  if (
    Array.isArray(
      boardData
    ) &&
    boardData.length === 81 &&
    Array.isArray(
      checkedData
    ) &&
    checkedData.length === 81
  ) {

    /*
      FREEは必ずON
    */

    checkedData[40] = boardData[40] === "FREE" ? true : Boolean(checkedData[40]);


    localStorage.setItem(
      CHECK_KEY,
      JSON.stringify(
        checkedData
      )
    );


    /*
      既存状態のまま表示
    */

    renderBoard(
      boardData,
      checkedData,
      getLastIndex()
    );

  }


  /*
    カードをまだ持っていない人だけ
    新しい4～8枚ルールで生成
  */

  else {

    generateNewBoard();

  }
}



/* ネギキャン：配達で固定されたマスを新しい順に1個だけ元へ戻す */
function cancelOneNegiDelivery(){
  let saved=[];
  try { saved=JSON.parse(localStorage.getItem(NEGI_DELIVERED_KEY)||'[]'); } catch(e){}
  if(!Array.isArray(saved) || saved.length===0){
    alert('安易にネギ配達ボタンは押さないこと\n（取り消せるネギ配達はありません）');
    return;
  }
  const index=saved.pop();
  localStorage.setItem(NEGI_DELIVERED_KEY,JSON.stringify(saved));
  const checked=getChecked();
  checked[index]=false;
  rollbackLuckyDraw(index);
  syncSurpriseProgress();
  localStorage.setItem(CHECK_KEY,JSON.stringify(checked));
  if(getLastIndex()===index)localStorage.removeItem(LAST_KEY);
  renderBoard(getBoard(),checked,getLastIndex());
  alert('安易にネギ配達ボタンは押さないこと');
}

/* 第6回サプライズイベント */

/* ネギ配達：未チェックのステーションを抽選して自動オープン */
const NEGI_DELIVERED_KEY="ark3_bingo_sixth_negi_delivered_v1";
function applyNegiDeliveredStyles(){
  let saved=[];
  try { saved=JSON.parse(localStorage.getItem(NEGI_DELIVERED_KEY)||"[]"); } catch(e){}
  if(!Array.isArray(saved))saved=[];
  for(const index of saved){
    const cell=document.querySelector('.cell[data-index="'+index+'"]');
    if(cell)cell.classList.add('negiDelivered');
  }
}
function deliverNegiRandom(){
  if(typeof surpriseBusy!=="undefined" && surpriseBusy)return;
  const board=getBoard(),checked=getChecked();
  const candidates=[];
  board.forEach((item,index)=>{
    if(index!==40 && !checked[index] && stationItems.includes(item))candidates.push(index);
  });
  if(!candidates.length){alert('未チェックのステーションパネルがありません！');return;}
  const index=candidates[Math.floor(Math.random()*candidates.length)];
  let saved=[];
  try{saved=JSON.parse(localStorage.getItem(NEGI_DELIVERED_KEY)||'[]');}catch(e){}
  if(!Array.isArray(saved))saved=[];
  if(!saved.includes(index))saved.push(index);
  localStorage.setItem(NEGI_DELIVERED_KEY,JSON.stringify(saved));
  if(negiMode){negiMode=false;updateNegiDisplay();updateNegiTargets();}
  openCell(index, "negiDelivery");
  applyNegiDeliveredStyles();
  const cell=document.querySelector('.cell[data-index="'+index+'"]');
  if(cell){cell.classList.add('negiDeliveryPulse');setTimeout(()=>cell.classList.remove('negiDeliveryPulse'),3100);}
}

const SURPRISE_CHANGED_KEY = "ark3_bingo_sixth_surprise_changed_index_v1";
const SURPRISE_KEY = "ark3_bingo_sixth_surprise_v1";
const SURPRISE_TARGET_KEY = "ark3_bingo_sixth_surprise_target_v1";
const SURPRISE_COUNT_KEY = "ark3_bingo_sixth_surprise_opens_v1";
let surpriseBusy = false;
function countManualOpenPanels(){
  const checked=getChecked();
  let delivered=[];
  try {delivered=JSON.parse(localStorage.getItem(NEGI_DELIVERED_KEY)||"[]");}catch(_){}
  const negiSet=new Set(Array.isArray(delivered)?delivered:[]);
  readStationIndices(STATION_CLEAR_BLUE_KEY).forEach(i=>negiSet.add(i));
  return checked.reduce((sum,on,i)=>sum+(i!==40 && on && !negiSet.has(i)?1:0),0);
}
function syncSurpriseProgress(){
  if(localStorage.getItem(SURPRISE_KEY))return;
  localStorage.setItem(SURPRISE_COUNT_KEY,String(countManualOpenPanels()));
}
function surpriseProgress() {
  if (surpriseBusy || stationClearBusy || localStorage.getItem(SURPRISE_KEY)) return;
  const count=countManualOpenPanels();
  localStorage.setItem(SURPRISE_COUNT_KEY,String(count));
  let target=Number(localStorage.getItem(SURPRISE_TARGET_KEY)||0);
  if(!target || target<25 || target>35){
    target=25+Math.floor(Math.random()*11);
    localStorage.setItem(SURPRISE_TARGET_KEY,String(target));
  }
  if(count>=target) setTimeout(()=>{
    if(countManualOpenPanels()>=target)startSurprise();
  },800);
}
function startSurprise() {
  if (surpriseBusy || stationClearBusy || localStorage.getItem(SURPRISE_KEY)) return;
  surpriseBusy = true;
  const overlay = document.getElementById("surpriseOverlay");
  const picture = document.getElementById("surpriseImage");
  const choices = document.getElementById("surpriseChoices");
  overlay.classList.add("active");
  choices.style.display = "none";
  picture.removeAttribute("src");
  const flash = document.getElementById("surpriseFlash");
  flash.style.background = "#000";
  flash.style.display = "block";
  setTimeout(() => {
    picture.src = "Q.png";
    flash.style.display = "none";
    choices.style.display = "flex";
  }, 800);
}
function chooseSurprise(yes) {
  if (!surpriseBusy) return;
  document.getElementById("surpriseChoices").style.display = "none";
  document.getElementById("surpriseImage").src = yes ? "YES.png" : "NO.png";
  localStorage.setItem(SURPRISE_KEY, yes ? "yes" : "no");

  const board = getBoard();
  const checked = getChecked();
  const candidates = [];
  for (let i = 0; i < 81; i++) {
    if (i === 40 || checked[i]) continue;
    // 「はい」: 地名・通常パネル、「いいえ」: ステーションパネルのみを対象にする。
    if (yes ? (areaItems.includes(board[i]) || normalItems.includes(board[i])) : stationItems.includes(board[i])) {
      candidates.push(i);
    }
  }

  // 1〜3マスを抽選。候補が少ない場合は候補数を上限とする。
  const changeCount = Math.min(1 + Math.floor(Math.random() * 3), candidates.length);
  const changedIndices = [];
  // 「はい」の変換順序: 1個目 塩浜 → 2個目 新橋 → 3個目 麻布十番
  const punishmentStations = ["塩浜", "新橋", "麻布十番"];
  for (let n = 0; n < changeCount; n++) {
    const pick = Math.floor(Math.random() * candidates.length);
    const index = candidates.splice(pick, 1)[0];
    if (yes) {
      board[index] = punishmentStations[n];
    } else {
      // 「いいえ」は各マスごとに笹塚かスタッフをランダム抽選。
      board[index] = Math.random() < 0.5
        ? "笹塚"
        : staffItems[Math.floor(Math.random() * staffItems.length)];
    }
    changedIndices.push(index);
  }

  if (changedIndices.length) {
    localStorage.setItem(SURPRISE_CHANGED_KEY, JSON.stringify(changedIndices));
    localStorage.setItem(BOARD_KEY, JSON.stringify(board));
  }
  setTimeout(() => {
    document.getElementById("surpriseOverlay").classList.remove("active");
    surpriseBusy = false;
    renderBoard(board, checked, getLastIndex());
    scheduleStationClearCheck();
    changedIndices.forEach(index => {
      const cell = document.querySelector('.cell[data-index="' + index + '"]');
      if (cell) cell.classList.add("surpriseChanged");
    });
  }, 3000);
}


/* ステーション全開放時の一度きりの隠しイベント */
const STATION_CLEAR_KEY="ark3_bingo_sixth_station_clear_v1";
const STATION_CLEAR_BLUE_KEY="ark3_bingo_sixth_station_clear_blue_v1";
const STATION_CLEAR_ADDED_KEY="ark3_bingo_sixth_station_clear_added_v1";
let stationClearBusy=false;
function clearStationClearData(){
  [STATION_CLEAR_KEY,STATION_CLEAR_BLUE_KEY,STATION_CLEAR_ADDED_KEY].forEach(k=>localStorage.removeItem(k));
}
function readStationIndices(key){
  try {const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[];}catch(_){return [];}
}
function applyStationClearStyles(){
  for(const i of readStationIndices(STATION_CLEAR_BLUE_KEY)){
    const cell=document.querySelector('.cell[data-index="'+i+'"]');
    if(cell)cell.classList.add("stationClearBlue");
  }
  for(const i of readStationIndices(STATION_CLEAR_ADDED_KEY)){
    const cell=document.querySelector('.cell[data-index="'+i+'"]');
    if(cell)cell.classList.add("stationClearAdded");
  }
}
function isStationPanel(item){return stationItems.includes(item)||item==="笹塚";}
function scheduleStationClearCheck(){
  if(stationClearBusy || surpriseBusy || localStorage.getItem(STATION_CLEAR_KEY))return;
  setTimeout(()=>{
    if(stationClearBusy || surpriseBusy || localStorage.getItem(STATION_CLEAR_KEY))return;
    const board=getBoard(), checked=getChecked();
    const stationIndices=[];
    board.forEach((item,i)=>{if(isStationPanel(item))stationIndices.push(i);});
    if(stationIndices.length && stationIndices.every(i=>checked[i]))startStationClear();
  },1100);
}
function startStationClear(){
  if(stationClearBusy || surpriseBusy || localStorage.getItem(STATION_CLEAR_KEY))return;
  stationClearBusy=true;
  const overlay=document.getElementById("stationClearOverlay");
  const choices=document.getElementById("stationClearChoices");
  const picture=document.getElementById("stationClearImage");
  choices.style.display="none";
  picture.removeAttribute("src");
  overlay.classList.add("active");
  setTimeout(()=>{picture.src="ara.png";choices.style.display="flex";},650);
}
function chooseStationClear(increase){
  if(!stationClearBusy || localStorage.getItem(STATION_CLEAR_KEY))return;
  document.getElementById("stationClearChoices").style.display="none";
  document.getElementById("stationClearImage").src=increase?"up.png":"down.png";
  const board=getBoard(), checked=getChecked();
  const available=[];
  board.forEach((item,i)=>{if(i!==40&&!checked[i])available.push(i);});
  const picked=[];
  for(let n=0;n<2&&available.length;n++){
    const pos=Math.floor(Math.random()*available.length);
    picked.push(available.splice(pos,1)[0]);
  }
  if(increase){
    board[40]="塩浜";
    checked[40]=false;
    let drawn=[];
    try{drawn=JSON.parse(localStorage.getItem(DRAWN_KEY)||"[]");}catch(_){}
    if(Array.isArray(drawn)&&drawn.length===81){drawn[40]=false;localStorage.setItem(DRAWN_KEY,JSON.stringify(drawn));}
    for(const i of picked)board[i]=stationItems[Math.floor(Math.random()*stationItems.length)];
    localStorage.setItem(STATION_CLEAR_ADDED_KEY,JSON.stringify([40,...picked]));
  }else{
    for(const i of picked)checked[i]=true;
    localStorage.setItem(STATION_CLEAR_BLUE_KEY,JSON.stringify(picked));
    // 自動開封は通常の当たり抽選・手動イベントカウントの対象外
  }
  localStorage.setItem(STATION_CLEAR_KEY,increase?"up":"down");
  localStorage.setItem(BOARD_KEY,JSON.stringify(board));
  localStorage.setItem(CHECK_KEY,JSON.stringify(checked));
  setTimeout(()=>{
    document.getElementById("stationClearOverlay").classList.remove("active");
    stationClearBusy=false;
    renderBoard(board,checked,getLastIndex());
  },3000);
}
